name: Build NEnQ Connect APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Instalar dependências
        run: npm install --legacy-peer-deps

      - name: Build React
        run: npm run build
        env:
          CI: false

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Adicionar plataforma Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Gerar ícones do app
        run: |
          npm install @capacitor/assets --legacy-peer-deps
          npx capacitor-assets generate --android || true

      - name: Permissão Gradle
        run: chmod +x android/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build APK (debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEnQ-Connect-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Confirmar geração
        run: |
          echo "✅ APK gerado com sucesso!"
          ls -lh android/app/build/outputs/apk/debug/
